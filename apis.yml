aid: quanta-therapeutics
name: Quanta Therapeutics
image: https://www.quantatx.com/themes/default/images/logo.svg
description: >-
  Quanta Therapeutics is a privately held, clinical-stage biopharmaceutical company founded in 2018
  and headquartered at 2 Tower Place in South San Francisco, California, with a second site in
  Radnor, Pennsylvania. It develops oral allosteric small-molecule medicines for RAS-driven cancers
  by targeting the protein-protein interactions that drive oncogenic RAS signaling, an approach the
  company describes as conformational blockade of RAS. Its discovery engine is a proprietary
  high-throughput Second Harmonic Generation (SHG) optical platform that detects subtle protein
  conformational changes and so surfaces allosteric modulators of signaling complexes that
  conventional binding assays miss. The clinical pipeline is a set of direct multi-KRAS inhibitors:
  QTX3034, a G12D-preferring oral multi-KRAS inhibitor in Phase 1 as monotherapy and in combination
  with cetuximab in KRAS G12D-mutant solid tumors; QTX3544, a G12V-preferring multi-KRAS inhibitor
  cleared for IND in January 2025; and QTX3046, which dosed its first patient in a Phase 1/1b trial
  in June 2024. Indications span pancreatic, colorectal, lung and endometrial cancers. The company
  announced a $60 million Series C in October 2021 and a Series D of over $50 million in May 2023
  led by Avidity Partners alongside Sofinnova Investments, Vida Ventures, Surveyor Capital,
  Longitude Capital and AbbVie Ventures. Quanta Therapeutics runs no developer program and publishes
  no public API. Its corporate site is a single static HTML document served from Apache with
  anchor-based sections; probes for OpenAPI, GraphQL, MCP, llms.txt and every /.well-known/
  discovery path returned HTTP 404, and no api./developer./docs. subdomain resolves.
